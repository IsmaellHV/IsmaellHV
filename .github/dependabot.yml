# Keeps the GitHub Actions used by the profile workflows up to date.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '09:00'
      timezone: 'America/Mexico_City'
    open-pull-requests-limit: 10
    reviewers:
      - 'IsmaellHV'
    assignees:
      - 'IsmaellHV'
    commit-message:
      prefix: 'ci'
      include: 'scope'
